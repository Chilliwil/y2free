<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Y2Free — Convertidor de YouTube a MP3 para creadores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <style>
/* Y2Free — dark futuristic minimal */

:root {
  --bg: #0a0a0f;
  --bg-2: #0d0d14;
  --surface: #11111a;
  --surface-2: #161622;
  --border: rgba(255,255,255,.08);
  --border-2: rgba(255,255,255,.14);
  --text: #f5f5fa;
  --text-dim: rgba(245,245,250,.55);
  --text-mute: rgba(245,245,250,.35);
  --accent: oklch(0.72 0.18 285);
  --accent-2: oklch(0.78 0.15 305);
  --accent-glow: oklch(0.72 0.18 285 / .35);
  --warn: oklch(0.78 0.15 35);
  --ok: oklch(0.78 0.16 150);
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "JetBrains Mono", monospace;
}

[data-theme="light"] {
  --bg: #faf9f6;
  --bg-2: #f3f2ee;
  --surface: #ffffff;
  --surface-2: #f6f5f1;
  --border: rgba(0,0,0,.08);
  --border-2: rgba(0,0,0,.14);
  --text: #15151c;
  --text-dim: rgba(20,20,28,.6);
  --text-mute: rgba(20,20,28,.4);
  --accent: oklch(0.55 0.18 285);
  --accent-2: oklch(0.62 0.18 305);
  --accent-glow: oklch(0.55 0.18 285 / .25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; }
.dim  { color: var(--text-dim); }
.sm   { font-size: 11px; }
.warn { color: var(--warn); }
.hl   { color: var(--accent); }

/* ─── nav ─── */
.y2-nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 32px;
  background: color-mix(in srgb, var(--bg) 75%, transparent);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--border);
}
.y2-nav-links { display: flex; gap: 28px; }
.y2-nav-links a {
  font-size: 13px; color: var(--text-dim);
  transition: color .2s;
  position: relative;
}
.y2-nav-links a:hover { color: var(--text); }
.y2-nav-cta { display: flex; align-items: center; gap: 8px; }

.y2-status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
  animation: y2-pulse 2.4s ease-in-out infinite;
}
@keyframes y2-pulse {
  0%,100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--ok) 0%, transparent); }
}

/* ─── hero ─── */
.y2-hero {
  position: relative;
  min-height: 88vh;
  padding: 80px 32px 100px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.y2-hero-inner {
  position: relative; z-index: 2;
  width: 100%; max-width: 880px;
  display: flex; flex-direction: column; align-items: center;
  gap: 24px;
}
.y2-hero.split .y2-hero-inner { max-width: 1180px; }

.y2-grid-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, var(--border) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 80%);
  opacity: .6;
}
.y2-spotlight {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 50% 40% at 50% 30%, var(--accent-glow), transparent 70%);
  pointer-events: none;
  animation: y2-breathe 8s ease-in-out infinite;
}
@keyframes y2-breathe {
  0%,100% { opacity: .55; transform: translateY(0); }
  50% { opacity: .85; transform: translateY(20px); }
}

.y2-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--border-2);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 60%, transparent);
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-dim);
}

.y2-h1 {
  margin: 0;
  font-size: clamp(40px, 6.4vw, 76px);
  line-height: 1;
  letter-spacing: -0.03em;
  font-weight: 500;
  text-align: center;
  text-wrap: balance;
}
.y2-h1.left { text-align: left; }
.y2-h1-accent {
  background: linear-gradient(120deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  font-style: italic;
  font-weight: 400;
}

.y2-hero-sub {
  margin: 0;
  font-size: clamp(15px, 1.5vw, 18px);
  color: var(--text-dim);
  text-align: center;
  max-width: 540px;
  text-wrap: pretty;
}
.y2-hero-sub.left { text-align: left; max-width: 460px; }

.y2-hero-stats {
  display: flex; gap: 48px; flex-wrap: wrap; justify-content: center;
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  width: 100%;
}
.y2-hero-stats.left { justify-content: flex-start; gap: 32px; }
.y2-stat-n {
  font-size: 22px; font-weight: 500; letter-spacing: -.02em;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.y2-stat-l { color: var(--text-mute); margin-top: 2px; font-size: 11px; }

/* hero split */
.split-grid {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 60px;
  align-items: center;
}
.split-left { display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
.split-converter-wrap {
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 24px 80px -20px var(--accent-glow);
}
.split-converter-label {
  color: var(--text-mute);
  margin-bottom: 14px;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
@media (max-width: 880px) {
  .split-grid { grid-template-columns: 1fr; }
  .y2-h1.left, .y2-hero-sub.left { text-align: center; }
  .y2-hero-stats.left { justify-content: center; }
}

/* hero immersive — orbits */
.y2-orbit {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  opacity: .5;
}
.y2-orbit-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--accent);
  opacity: .25;
}
.y2-orbit-ring.r1 { width: 480px; height: 480px; animation: y2-spin 40s linear infinite; }
.y2-orbit-ring.r2 { width: 720px; height: 720px; animation: y2-spin 60s linear infinite reverse; opacity: .15; }
.y2-orbit-ring.r3 { width: 1000px; height: 1000px; animation: y2-spin 90s linear infinite; opacity: .08; }
@keyframes y2-spin { to { transform: rotate(360deg); } }

.y2-immersive-wave {
  width: 100%; max-width: 720px;
  margin-bottom: 8px;
  opacity: .9;
}

/* ─── waveform ─── */
.y2-wave {
  display: flex; align-items: center; gap: 3px;
  width: 100%;
}
.y2-wave-bar {
  flex: 1;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  border-radius: 2px;
  min-height: 4px;
  transform-origin: center;
}
.y2-wave-bar.active {
  animation: y2-bar 1.4s ease-in-out infinite;
}
@keyframes y2-bar {
  0%,100% { transform: scaleY(.4); opacity: .5; }
  50% { transform: scaleY(1); opacity: 1; }
}

/* ─── conversor ─── */
.y2-conv {
  width: 100%;
  display: flex; flex-direction: column; gap: 14px;
}

.y2-input-wrap {
  display: flex; align-items: center;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 14px;
  padding: 6px 6px 6px 18px;
  transition: border-color .2s, box-shadow .2s;
}
.y2-input-wrap:focus-within {
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  box-shadow: 0 0 0 4px var(--accent-glow);
}
.y2-input-wrap.valid {
  border-color: color-mix(in srgb, var(--ok) 50%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent);
}
.y2-input-icon {
  color: var(--text-mute);
  margin-right: 12px;
  font-size: 11px; letter-spacing: .1em;
}
.y2-input {
  flex: 1; min-width: 0;
  background: transparent; border: 0;
  color: var(--text);
  font-family: var(--font-mono); font-size: 14px;
  padding: 14px 8px;
  outline: none;
}
.y2-input::placeholder { color: var(--text-mute); }
.y2-input-clear {
  background: transparent; border: 0;
  color: var(--text-mute);
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  cursor: pointer;
  margin-right: 8px;
}
.y2-input-clear:hover { background: var(--border); color: var(--text); }

/* button styles */
.y2-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 44px;
  padding: 0 22px;
  border-radius: 10px;
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  border: 1px solid transparent;
  white-space: nowrap;
}
.y2-btn:disabled { opacity: .4; cursor: not-allowed; }

.y2-btn.filled {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.y2-btn.filled:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.y2-btn.outline {
  background: transparent;
  color: var(--text);
  border-color: var(--border-2);
}
.y2-btn.outline:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}

.y2-btn.glow {
  background: linear-gradient(120deg, var(--accent), var(--accent-2));
  color: white;
  border: 0;
  box-shadow: 0 8px 24px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
  position: relative; overflow: hidden;
}
.y2-btn.glow:hover:not(:disabled) {
  box-shadow: 0 12px 40px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.4);
  transform: translateY(-1px);
}
.y2-btn.glow::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
  transform: translateX(-100%);
  transition: transform .6s;
}
.y2-btn.glow:hover::before { transform: translateX(100%); }

.y2-input-help {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 4px;
  font-size: 11px;
}

/* ─── preview card ─── */
.y2-preview {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  display: flex; gap: 16px;
  animation: y2-rise .4s ease-out;
}
@keyframes y2-rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.y2-thumb {
  position: relative;
  flex-shrink: 0;
  width: 168px; height: 96px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface-2);
}
.y2-thumb-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 30% 40%, var(--accent), transparent 50%),
    radial-gradient(circle at 70% 70%, var(--accent-2), transparent 60%),
    var(--surface-2);
  opacity: .8;
}
.y2-thumb-grid {
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,.05) 8px 9px);
}
.y2-thumb-meta {
  position: absolute; right: 6px; bottom: 6px;
  background: rgba(0,0,0,.6); color: white;
  padding: 2px 6px; border-radius: 4px;
  font-size: 10px;
}

.y2-preview-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.y2-preview-title {
  font-size: 15px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.y2-preview-sub { color: var(--text-dim); font-size: 11px; }

.y2-controls { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.y2-row { display: flex; align-items: center; gap: 12px; }
.y2-row-lbl { width: 64px; color: var(--text-mute); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }

.y2-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.y2-chip {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-dim);
  padding: 5px 10px;
  border-radius: 6px;
  font-family: var(--font-mono); font-size: 11px;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex; align-items: center; gap: 6px;
  position: relative;
}
.y2-chip:hover { color: var(--text); border-color: var(--text-dim); }
.y2-chip.on {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.y2-chip-sub {
  font-size: 9px;
  opacity: .55;
  letter-spacing: .04em;
}
.y2-chip.on .y2-chip-sub { opacity: .8; }
.y2-chip-badge {
  font-size: 8px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 3px;
  background: linear-gradient(120deg, var(--accent), var(--accent-2));
  color: white;
  letter-spacing: .06em;
}
.y2-chip.on .y2-chip-badge {
  background: white;
  color: var(--accent);
}

.y2-typeswitch {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  gap: 2px;
}
.y2-type {
  display: inline-flex; align-items: center;
  padding: 5px 12px;
  background: transparent;
  border: 0;
  color: var(--text-dim);
  font-family: var(--font-mono); font-size: 11px;
  border-radius: 5px;
  cursor: pointer;
  transition: all .18s;
}
.y2-type:hover { color: var(--text); }
.y2-type.on {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.3), inset 0 0 0 1px var(--border-2);
}

/* trim bar */
.y2-trim {
  position: relative; flex: 1; height: 28px;
  display: flex; align-items: center;
  cursor: pointer;
}
.y2-trim-track {
  position: absolute; left: 0; right: 0;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
}
.y2-trim-fill {
  position: absolute;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 2px;
}
.y2-trim-handle {
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: white;
  border: 2px solid var(--accent);
  transform: translateX(-50%);
  cursor: ew-resize;
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.y2-trim-tooltip {
  position: absolute;
  top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 9px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 2px 5px;
  border-radius: 4px;
  white-space: nowrap;
  color: var(--text-dim);
}

/* progress */
.y2-progress {
  position: relative;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 4px;
}
.y2-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .15s linear;
}
.y2-progress-glow {
  position: absolute; top: -4px;
  width: 14px; height: 14px;
  background: var(--accent);
  border-radius: 50%;
  filter: blur(8px);
  transform: translateX(-50%);
  opacity: .8;
}

.y2-done {
  display: flex; align-items: center; gap: 12px;
  margin-top: 4px;
}

/* history */
.y2-history {
  background: color-mix(in srgb, var(--surface) 50%, transparent);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}
.y2-history-hd {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
  font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
}
.y2-history-list { display: flex; flex-direction: column; }
.y2-history-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.y2-history-item:last-child { border: 0; }
.y2-history-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.y2-history-title {
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text-dim);
}
.y2-link {
  background: transparent; border: 0;
  color: var(--accent);
  font-size: 11px;
  cursor: pointer;
  padding: 2px 4px;
}
.y2-link:hover { text-decoration: underline; }

/* ─── sections ─── */
.y2-section {
  position: relative;
  padding: 100px 32px;
  max-width: 1180px;
  margin: 0 auto;
}
.y2-sect-hd {
  display: flex; flex-direction: column;
  gap: 14px; align-items: flex-start;
  margin-bottom: 56px;
  max-width: 640px;
}
.y2-h2 {
  margin: 0;
  font-size: clamp(28px, 3.8vw, 48px);
  line-height: 1.05;
  letter-spacing: -.025em;
  font-weight: 500;
  text-wrap: balance;
}
.y2-sect-sub {
  margin: 0;
  color: var(--text-dim);
  font-size: 16px;
  text-wrap: pretty;
}

/* ─── howto mockups ─── */
.y2-howto {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 24px;
  align-items: center;
}

.y2-mock {
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  transition: transform .4s, box-shadow .4s, border-color .4s;
  opacity: .55;
}
.y2-mock.active {
  opacity: 1;
  border-color: color-mix(in srgb, var(--accent) 35%, var(--border-2));
  box-shadow: 0 24px 60px -20px var(--accent-glow);
  transform: translateY(-4px);
}

.y2-mock-chrome {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 14px;
  background: #1a1a23;
  border-bottom: 1px solid var(--border);
}
.y2-mock-chrome:not(.dark) {
  background: #f5f5f5;
  border-bottom: 1px solid #e0e0e0;
}
.y2-mock-dot { width: 10px; height: 10px; border-radius: 50%; }
.y2-mock-dot.r { background: #ff5f57; }
.y2-mock-dot.y { background: #febc2e; }
.y2-mock-dot.g { background: #28c840; }
.y2-mock-url {
  flex: 1;
  margin-left: 10px;
  padding: 4px 10px;
  background: rgba(0,0,0,.06);
  border-radius: 6px;
  color: #444;
  font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.y2-mock-url.dark {
  background: rgba(255,255,255,.06);
  color: var(--text-dim);
}

.y2-mock-body {
  padding: 18px;
  background: white;
  color: #15151c;
  min-height: 260px;
  display: flex; flex-direction: column; gap: 10px;
}
.y2-mock-body.dark {
  background: var(--surface);
  color: var(--text);
}

.y2-mock-video {
  position: relative;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, #1a1a23, #2a1f3a);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.y2-mock-play {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {

function TweakRow({ label, value, children, inline = false }) {

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

const DEMO_TRACKS = [
  { id: "dQw4w9WgXcQ", title: "Atmospheric Cinematic Pad — Loop B", channel: "Yvonne / Sound Atelier", duration: "3:42", views: "1.2M" },
  { id: "9bZkp7q19f0", title: "Lo-Fi Beat Pack — 90 BPM", channel: "northbeats", duration: "2:18", views: "847K" },
  { id: "kJQP7kiw5Fk", title: "Documentary Tension Bed", channel: "Foley Garage", duration: "4:05", views: "312K" },
  { id: "M7lc1UVf-VE", title: "Soft Synth Bell — One Shot", channel: "Aria Lab", duration: "0:48", views: "92K" },
];

function parseYouTubeId(url) {
  if (!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
    /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

function pickDemoTrack(id) {
  // Pseudo-deterministic mapping: same id always returns same demo track
  const sum = id.split("").reduce((a, c) => a + c.charCodeAt(0), 0);
  return DEMO_TRACKS[sum % DEMO_TRACKS.length];
}

function Converter({ buttonStyle = "filled" }) {
  const [url, setUrl] = useState("");
  const [stage, setStage] = useState("idle"); // idle | preview | converting | done
  const [progress, setProgress] = useState(0);
  const [format, setFormat] = useState("mp3-320");
  const [formatType, setFormatType] = useState("audio"); // audio | video
  const [trim, setTrim] = useState({ start: 0, end: 100 });
  const [meta, setMeta] = useState(null);
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem("y2-history") || "[]"); }
    catch { return []; }
  });

  const id = parseYouTubeId(url);
  const valid = !!id;

  useEffect(() => {
    if (!valid) { setStage("idle"); setMeta(null); return; }
    if (stage === "idle" || stage === "preview") {
      setMeta(pickDemoTrack(id));
      setStage("preview");
    }
  }, [url, valid]);

  useEffect(() => {
    if (stage !== "converting") return;
    setProgress(0);
    const t = setInterval(() => {
      setProgress((p) => {
        if (p >= 100) {
          clearInterval(t);
          setStage("done");
          const next = [{ id, ...meta, format, at: Date.now() }, ...history].slice(0, 6);
          setHistory(next);
          try { localStorage.setItem("y2-history", JSON.stringify(next)); } catch {}
          return 100;
        }
        return p + (3 + Math.random() * 7);
      });
    }, 110);
    return () => clearInterval(t);
  }, [stage]);

  const reset = () => { setUrl(""); setStage("idle"); setMeta(null); setProgress(0); };

  const onConvert = () => {
    if (!valid) return;
    setStage("converting");
  };

  const btnClass = `y2-btn ${buttonStyle === "outline" ? "outline" : buttonStyle === "glow" ? "glow" : "filled"}`;

  return (
    <div className="y2-conv">
      <div className={`y2-input-wrap ${valid ? "valid" : ""}`}>
        <span className="y2-input-icon mono">URL</span>
        <input
          type="text"

            </svg>
          </button>
        )}
        <button
          className={btnClass}
          onClick={onConvert}
          disabled={!valid || stage === "converting"}
        >
          {stage === "converting" ? "Convirtiendo…" : stage === "done" ? "Convertir otro" : "Convertir"}
        </button>
      </div>

      <div className="y2-input-help">
        <span className="mono dim">
          {!url && "MP3 · M4A · MP4 hasta 4K · youtube.com / youtu.be / shorts"}
          {url && !valid && <span className="warn">Link no reconocido. Verifica el formato.</span>}
          {valid && stage === "preview" && "Link válido — listo para convertir"}
          {stage === "converting" && `Procesando… ${Math.round(progress)}%`}
          {stage === "done" && "Listo. Tu archivo está disponible abajo."}
        </span>
        <span className="mono dim">{valid && id && `id · ${id}`}</span>
      </div>

      {/* Preview card */}
      {meta && (stage === "preview" || stage === "converting" || stage === "done") && (
        <div className="y2-preview">
          <div className="y2-thumb">
            <div className="y2-thumb-bg" />
            <div className="y2-thumb-grid" />
            <div className="y2-thumb-meta mono">{meta.duration}</div>
          </div>
          <div className="y2-preview-body">
            <div className="y2-preview-title">{meta.title}</div>
            <div className="y2-preview-sub mono">{meta.channel} · {meta.views} vistas</div>

            <div className="y2-controls">
              <div className="y2-row">
                <span className="y2-row-lbl mono">Tipo</span>
                <div className="y2-typeswitch">
                  <button
                    className={formatType === "audio" ? "y2-type on" : "y2-type"}
                    onClick={() => { setFormatType("audio"); setFormat("mp3-320"); }}
                  >
                    <svg width="12" height="12" viewBox="0 0 14 14" fill="none" style={{marginRight:6}}>
                      <path d="M3 7h1M5.5 4v6M8 2v10M10.5 5v4M13 7h-1" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                    </svg>
                    Audio

                  <button
                    className={formatType === "video" ? "y2-type on" : "y2-type"}

                  >

                      <rect x="1" y="3" width="9" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/>
                      <path d="M10 6.5l3-1.5v4l-3-1.5" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/>

                  {(formatType === "audio" ? [

            )}

            {stage === "done" && (
              <div className="y2-done">
                <button className="y2-btn glow">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{marginRight:8}}>

                  </svg>
                  Descargar {format.toUpperCase().replace("-", " ")}

                <span className="mono dim sm">·  ~{
                  format === "mp4-2160" ? (180 + Math.random()*60).toFixed(0) :

              </div>
            )}
          </div>
        </div>
      )}

      {/* History */}
      {history.length > 0 && stage !== "converting" && (
        <div className="y2-history">

                <button className="y2-link mono">re-descargar</button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Dual-handle trim
function TrimBar({ value, onChange }) {
  const ref = useRef(null);
  const onDrag = (which) => (e) => {
    e.preventDefault();
    const move = (ev) => {
      const r = ref.current.getBoundingClientRect();
      const x = Math.max(0, Math.min(100, ((ev.clientX - r.left) / r.width) * 100));
      const next = { ...value, [which]: x };
      if (which === "start" && x > value.end - 5) return;
      if (which === "end" && x < value.start + 5) return;
      onChange(next);
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };
  const fmt = (p) => {
    const total = 222; // pretend 3:42 in seconds
    const s = Math.round((p / 100) * total);
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  };
  return (
    <div className="y2-trim" ref={ref}>
      <div className="y2-trim-track" />
      <div className="y2-trim-fill" style={{ left: `${value.start}%`, width: `${value.end - value.start}%` }} />
      <div className="y2-trim-handle" style={{ left: `${value.start}%` }} onPointerDown={onDrag("start")}>
        <span className="y2-trim-tooltip mono">{fmt(value.start)}</span>
      </div>
      <div className="y2-trim-handle" style={{ left: `${value.end}%` }} onPointerDown={onDrag("end")}>
        <span className="y2-trim-tooltip mono">{fmt(value.end)}</span>
      </div>
    </div>
  );
}

              onChange={(v) => setTweak("heroLayout", v)}
            />
            <TweakSection label="Botón" />
            <TweakRadio
              label="Estilo"
              value={t.buttonStyle}
              options={[
                { value: "glow", label: "Glow" },
                { value: "filled", label: "Filled" },
                { value: "outline", label: "Outline" },
              ]}
              onChange={(v) => setTweak("buttonStyle", v)}
            />
          </TweaksPanel>
        </>
      );
    }

    function tryMount() {
      if (typeof HeroCentered === "undefined" || typeof Nav === "undefined" || typeof useTweaks === "undefined") {
        setTimeout(tryMount, 30);
        return;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    }
    tryMount();
  </script>
</body>
</html>
